name: Build AnimStudio Mod
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
    - run: chmod +x gradlew
    - run: ./gradlew setupDecompWorkspace --no-daemon
    - run: ./gradlew build --no-daemon
    - uses: actions/upload-artifact@v3
      with:
        name: AnimStudio-1.0.0
        path: build/libs/AnimStudio-1.0.0.jar
